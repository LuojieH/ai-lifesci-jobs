name: Scrape jobs

on:
  schedule:
    - cron: "0 12 * * *"   # daily, 12:00 UTC (8am ET)
  workflow_dispatch:        # "Run workflow" button in the Actions tab
  push:
    paths:
      - "scraper/**"

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scrape
        run: python scraper/scrape.py
      - name: Commit updated jobs.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add docs/jobs.json
          git diff --cached --quiet || git commit -m "Update jobs $(date -u +%Y-%m-%d)"
          git push
